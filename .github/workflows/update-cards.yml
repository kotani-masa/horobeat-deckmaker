name: カードデータ更新

on:
  workflow_dispatch:          # Actions タブの「Run workflow」から手動実行
  schedule:
    - cron: "17 21 * * *"     # 毎日 6:17 (JST) に公式データを確認
  push:
    branches: [main]
    paths:
      - update_cards.mjs
      - .github/workflows/update-cards.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 公式カード検索から取得
        run: node update_cards.mjs index.html
      - name: 変更があればコミット
        run: |
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "カードデータを公式サイトから更新"
          git push
